[metadata]
name = flashinfer-npu
version = 0.1.0.dev0
description = FlashInfer-style inference kernel library for Ascend NPU
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
include = flashinfer_npu*

[options.package_data]
flashinfer_npu =
    data/*.json
    data/kernels/*.json

[options.entry_points]
console_scripts =
    flashinfer-npu = flashinfer_npu.cli:main
